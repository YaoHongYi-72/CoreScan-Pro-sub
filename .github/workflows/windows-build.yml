name: Windows Build

on:
  push:
    branches: [ main, master ]
    tags:     [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    # ------------------------------------------------------------------ #
    # 1. Checkout
    # ------------------------------------------------------------------ #
    - name: Checkout repository
      uses: actions/checkout@v4

    # ------------------------------------------------------------------ #
    # 2. Install Qt6 via aqtinstall
    # ------------------------------------------------------------------ #
    - name: Install Qt 6.6
      uses: jurplel/install-qt-action@v3
      with:
        version:   '6.6.3'
        host:      'windows'
        target:    'desktop'
        arch:      'win64_msvc2019_64'
        modules:   'qtcharts'
        cache:     true

    # ------------------------------------------------------------------ #
    # 3. Set up MSVC
    # ------------------------------------------------------------------ #
    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    # ------------------------------------------------------------------ #
    # 4. Install Eigen3 and OSQP via vcpkg
    # ------------------------------------------------------------------ #
    - name: Install vcpkg dependencies
      run: |
        vcpkg install eigen3:x64-windows osqp:x64-windows
        echo "VCPKG_INSTALLED_DIR=$env:VCPKG_INSTALLATION_ROOT\installed" >> $env:GITHUB_ENV
        echo "VCPKG_TARGET_TRIPLET=x64-windows" >> $env:GITHUB_ENV
      shell: pwsh

    # ------------------------------------------------------------------ #
    # 5. Configure (CMake)
    # ------------------------------------------------------------------ #
    - name: Configure CMake
      run: |
        cmake -B build -S . `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=x64-windows `
          -DVCPKG_INSTALLED_DIR="$env:VCPKG_INSTALLATION_ROOT\installed"
      shell: pwsh

    # ------------------------------------------------------------------ #
    # 6. Build
    # ------------------------------------------------------------------ #
    - name: Build
      run: cmake --build build --config Release --parallel
      shell: pwsh

    # ------------------------------------------------------------------ #
    # 7. Package (windeployqt + NSIS installer)
    # ------------------------------------------------------------------ #
    - name: Package
      run: |
        # Copy exe to a clean staging dir
        New-Item -ItemType Directory -Force -Path dist
        Copy-Item build\Release\SpectralMatcher.exe dist\

        # Qt6_DIR is the Qt root, e.g. D:\a\...\Qt\6.6.3\msvc2019_64
        $windeployqt = "$env:Qt6_DIR\bin\windeployqt.exe"
        Write-Host "windeployqt: $windeployqt"
        & $windeployqt --no-translations --no-system-d3d-compiler dist\SpectralMatcher.exe

        # Copy vcpkg runtime DLLs (osqp, etc.)
        $vcpkgBin = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin"
        if (Test-Path $vcpkgBin) {
          Copy-Item "$vcpkgBin\*.dll" dist\ -ErrorAction SilentlyContinue
        }

        # Copy MSVC runtime DLLs
        $msvcRedist = (Get-ChildItem "$env:VCToolsRedistDir\x64\Microsoft.VC*.CRT" -ErrorAction SilentlyContinue | Select-Object -First 1)?.FullName
        if ($msvcRedist) {
          Copy-Item "$msvcRedist\*.dll" dist\ -ErrorAction SilentlyContinue
        }
      shell: pwsh

    # ------------------------------------------------------------------ #
    # 8. Create NSIS installer
    # ------------------------------------------------------------------ #
    - name: Create NSIS installer
      run: |
        choco install nsis -y --no-progress
        $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"

        # Write NSIS script
        $nsis = @'
!include "MUI2.nsh"
Name "SpectralMatcher"
OutFile "SpectralMatcher-Setup.exe"
InstallDir "$PROGRAMFILES64\SpectralMatcher"
RequestExecutionLevel admin

!insertmacro MUI_PAGE_WELCOME
!insertmacro MUI_PAGE_DIRECTORY
!insertmacro MUI_PAGE_INSTFILES
!insertmacro MUI_PAGE_FINISH
!insertmacro MUI_UNPAGE_CONFIRM
!insertmacro MUI_UNPAGE_INSTFILES
!insertmacro MUI_LANGUAGE "SimpChinese"

Section "Main"
  SetOutPath "$INSTDIR"
  File /r "dist\*.*"
  WriteUninstaller "$INSTDIR\Uninstall.exe"
  CreateShortcut "$DESKTOP\SpectralMatcher.lnk" "$INSTDIR\SpectralMatcher.exe"
  WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\SpectralMatcher" "DisplayName" "SpectralMatcher"
  WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\SpectralMatcher" "UninstallString" "$INSTDIR\Uninstall.exe"
SectionEnd

Section "Uninstall"
  Delete "$INSTDIR\*.*"
  RMDir /r "$INSTDIR"
  Delete "$DESKTOP\SpectralMatcher.lnk"
  DeleteRegKey HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\SpectralMatcher"
SectionEnd
'@
        $nsis | Out-File -Encoding UTF8 installer.nsi
        & $makensis installer.nsi
      shell: pwsh

    # ------------------------------------------------------------------ #
    # 9. Upload artifact (for every build)
    # ------------------------------------------------------------------ #
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: SpectralMatcher-Setup
        path: SpectralMatcher-Setup.exe
        retention-days: 30

    # ------------------------------------------------------------------ #
    # 10. Create GitHub Release (only on version tags)
    # ------------------------------------------------------------------ #
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: SpectralMatcher-Setup.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
