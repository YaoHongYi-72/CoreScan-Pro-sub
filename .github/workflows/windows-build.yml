name: Windows Build

on:
  push:
    branches: [ main, master ]
    tags:     [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    # ------------------------------------------------------------------ #
    # 1. Checkout
    # ------------------------------------------------------------------ #
    - name: Checkout repository
      uses: actions/checkout@v4

    # ------------------------------------------------------------------ #
    # 2. Install Qt6 via aqtinstall
    # ------------------------------------------------------------------ #
    - name: Install Qt 6.6
      uses: jurplel/install-qt-action@v3
      with:
        version:   '6.6.3'
        host:      'windows'
        target:    'desktop'
        arch:      'win64_msvc2019_64'
        modules:   'qtcharts'
        cache:     true

    # ------------------------------------------------------------------ #
    # 3. Set up MSVC
    # ------------------------------------------------------------------ #
    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    # ------------------------------------------------------------------ #
    # 4. Install Eigen3 and OSQP via vcpkg
    # ------------------------------------------------------------------ #
    - name: Install vcpkg dependencies
      run: |
        vcpkg install eigen3:x64-windows osqp:x64-windows
        echo "VCPKG_INSTALLED_DIR=$env:VCPKG_INSTALLATION_ROOT\installed" >> $env:GITHUB_ENV
        echo "VCPKG_TARGET_TRIPLET=x64-windows" >> $env:GITHUB_ENV
      shell: pwsh

    # ------------------------------------------------------------------ #
    # 5. Configure (CMake)
    # ------------------------------------------------------------------ #
    - name: Configure CMake
      run: |
        cmake -B build -S . `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=x64-windows `
          -DVCPKG_INSTALLED_DIR="$env:VCPKG_INSTALLATION_ROOT\installed"
      shell: pwsh

    # ------------------------------------------------------------------ #
    # 6. Build
    # ------------------------------------------------------------------ #
    - name: Build
      run: cmake --build build --config Release --parallel
      shell: pwsh

    # ------------------------------------------------------------------ #
    # 7. Package (windeployqt + zip)
    # ------------------------------------------------------------------ #
    - name: Package
      run: |
        # Copy exe to a clean staging dir
        New-Item -ItemType Directory -Force -Path dist
        Copy-Item build\Release\SpectralMatcher.exe dist\

        # Qt6_DIR is set by install-qt-action, e.g. D:\a\...\Qt\6.6.3\msvc2019_64\lib\cmake\Qt6
        # windeployqt is in the bin dir two levels up from lib/cmake/Qt6
        $qtBin = (Get-Item "$env:Qt6_DIR\..\..\..\bin").FullName
        Write-Host "Qt bin dir: $qtBin"
        & "$qtBin\windeployqt.exe" --no-translations --no-system-d3d-compiler dist\SpectralMatcher.exe

        # Compress
        Compress-Archive -Path dist\* -DestinationPath SpectralMatcher-windows-x64.zip
      shell: pwsh

    # ------------------------------------------------------------------ #
    # 8. Upload artifact (for every build)
    # ------------------------------------------------------------------ #
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: SpectralMatcher-windows-x64
        path: SpectralMatcher-windows-x64.zip
        retention-days: 30

    # ------------------------------------------------------------------ #
    # 9. Create GitHub Release (only on version tags)
    # ------------------------------------------------------------------ #
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: SpectralMatcher-windows-x64.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
